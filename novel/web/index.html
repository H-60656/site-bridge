  $("set-lh").addEventListener("input", (e) => { settings.lh = Number(e.target.value); saveSettings(); });
  $("set-w").addEventListener("input", (e) => { settings.w = Number(e.target.value); saveSettings(); });
  $("set-theme").addEventListener("change", (e) => { settings.theme = e.target.value; saveSettings(); });
  $("set-font").addEventListener("change", (e) => { settings.font = e.target.value; saveSettings(); });
  $("set-reset").addEventListener("click", () => { settings = Object.assign({}, DEFAULT_SETTINGS); saveSettings(); showToast("已恢复默认"); });

  // 书架与下载（写进项目里的 data/settings.json）
  $("set-libdir-add").addEventListener("click", () => {
    const input = $("set-libdir");
    const dir = (input.value || "").trim();
    if (!dir) { showToast("先填一个目录，例如 D:\\novels"); return; }
    const cfg = (state.serverConfig && state.serverConfig.config) || {};
    const dirs = (cfg.library_dirs || []).concat([dir]).filter((v, i, a) => a.indexOf(v) === i);
    input.value = "";
    saveServerConfig({ library_dirs: dirs });
  });
  $("set-lib-list").addEventListener("click", (e) => {
    const rm = e.target.closest("[data-librm]");
    if (!rm) return;
    const cfg = (state.serverConfig && state.serverConfig.config) || {};
    saveServerConfig({ library_dirs: (cfg.library_dirs || []).filter((d) => d !== rm.dataset.librm) });
  });
  const saveSwitches = () => saveServerConfig({
    merge_series: $("set-merge").value === "1",
    skip_downloaded: $("set-skip").value === "1",
    scan_depth: Number($("set-depth").value),
  });
  $("set-save").addEventListener("click", saveSwitches);
  for (const id of ["set-merge", "set-skip", "set-depth"]) $(id).addEventListener("change", saveSwitches);

  document.addEventListener("keydown", (e) => {
    // Esc 永远先处理（在抽屉的滑块/下拉上按 Esc 也要能关掉抽屉）
    if (e.key === "Escape") {
      const hadDrawer = ["toc", "settings"].some((id) => !$(id).hidden);
      closeDrawers();
      if (!hadDrawer && state.view === "reader") goList();
      return;
    }
    if (e.target && /INPUT|SELECT|TEXTAREA/.test(e.target.tagName)) return;
    // 抽屉开着时把 Tab 限制在抽屉里（配合 role="dialog" aria-modal="true"）
    if (e.key === "Tab") {
      const drawer = ["toc", "settings"].map((id) => $(id)).find((el) => !el.hidden);
      if (drawer) trapTab(drawer, e);
      return;
    }
    if (state.view !== "reader") return;
    if (e.key === "ArrowLeft") gotoChapter(-1);
    if (e.key === "ArrowRight") gotoChapter(1);
  });
  window.addEventListener("hashchange", route);
  // iOS Safari 上 beforeunload 不可靠，pagehide 更稳；两个都挂，重复保存无副作用
  const leave = () => {
    saveProgress();
    const cur = state.current;
    if (cur && cur.novel && !cur.local) beaconHistory(historyEntry(cur.novel));   // 离页时补最后一条
  };
  window.addEventListener("beforeunload", leave);
  window.addEventListener("pagehide", leave);
}

/* ---------------- 旧版服务自检 ----------------
   页面每次都从磁盘读取（改页面刷新即可生效），但**路由**属于服务进程，重启才更新。
   启动时读一次 /openapi.json：若缺少小说接口，直接在页面上说明该怎么办，
   省得「打开小说报 404」时靠猜。 */
async function checkRoutes() {
  const banner = $("ver-banner");
  try {
    const resp = await fetch("/openapi.json", { cache: "no-store" });
    if (!resp.ok) { banner.hidden = true; return; }
    const spec = await resp.json();
    const paths = (spec && spec.paths) || {};
    const needed = ["/api/novel/{novel_id}", "/api/novel/{novel_id}/text", "/api/history",
      "/api/bookmarks", "/api/downloads", "/api/config", "/api/library"];
    const missing = needed.filter((p) => !paths[p]);
    if (!missing.length) { banner.hidden = true; return; }
    banner.hidden = false;
    banner.textContent = "⚠ 后台服务是旧版本：缺少接口 " + missing.join("、") +
      "。请停止服务、用最新代码重新启动，然后刷新本页（页面本身会自动更新，路由不会）。";
  } catch (err) {
    banner.hidden = true;
  }
}

/* ---------------- 启动 ---------------- */
// 手机屏窄，搜索框放不下长提示
if (window.matchMedia("(max-width:640px)").matches) $("q-word").placeholder = "搜索关键词 / 标签";
applySettings();
bind();
loadAuthBadge();
checkRoutes();
hydrateHistory();   // 把项目里的阅读历史并进书架（换浏览器也能看到最近在读）
loadServerConfig(); // 项目配置（本地书架目录 / 合并 / 跳过已下载）
loadFavs();         // 收藏台账
route();
// 首屏直接给出榜单内容（搜索框固定在页面上方，回车即搜）
if (!location.hash || location.hash === "#/") {
  $("list-meta").textContent = "正在加载榜单…";
  setNavSource("ranking");
}
</script>
</body>
</html>
