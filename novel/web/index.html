<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light dark" />
<title>Pixiv 小说阅读器 · Pixiv Bridge</title>
<style>
:root{
  --bg:#f5f6f8; --panel:#ffffff; --text:#1d2129; --muted:#86909c; --line:#e5e6eb;
  --primary:#3b6ef0; --primary-soft:#eef3ff; --danger:#e5484d; --shadow:0 2px 10px rgba(20,24,35,.08);
  --r:14px;
  --warn:#b4531a; --warn-soft:rgba(224,112,42,.12); --warn-line:rgba(224,112,42,.35);
  --toast-bg:rgba(29,33,41,.94); --toast-fg:#fff;
}
body.theme-sepia{--bg:#f3ead9;--panel:#fbf5e7;--text:#3b3226;--muted:#9c8d76;--line:#e3d7bf;--primary:#96652f;--primary-soft:#f0e3c9;
  --warn:#8a4b13; --warn-soft:rgba(150,101,47,.14); --warn-line:rgba(150,101,47,.35);}
body.theme-dark{--bg:#16181d;--panel:#1f2229;--text:#dfe2e8;--muted:#8b93a1;--line:#2e323b;--primary:#6f9bff;--primary-soft:#232a3a;--shadow:0 2px 10px rgba(0,0,0,.4);
  --warn:#f0a35e; --warn-soft:rgba(240,163,94,.14); --warn-line:rgba(240,163,94,.35);
  --toast-bg:rgba(240,242,246,.95); --toast-fg:#16181d;}
/* 注意：任何 id 级 display 规则都会压过 [hidden]，这里的 !important 是必须的 */
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text); -webkit-text-size-adjust:100%;
  font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
a{color:var(--primary)}
img{max-width:100%}
html{-webkit-tap-highlight-color:transparent}

/* ---------- 顶栏 ---------- */
header{
  position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;
  padding:10px 14px;background:var(--panel);border-bottom:1px solid var(--line);
}
.brand{display:flex;align-items:center;gap:8px;min-width:0}
.logo{
  display:grid;place-items:center;width:28px;height:28px;border-radius:8px;flex:0 0 auto;
  background:var(--primary);color:#fff;font-size:15px;font-weight:700;
}
.brand h1{margin:0;font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr-right{margin-left:auto;display:flex;align-items:center;gap:8px}
#auth-badge{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:3px 9px;white-space:nowrap}
#auth-badge.ok{color:var(--primary);border-color:var(--primary);background:var(--primary-soft)}

/* ---------- 导航 ---------- */
nav{display:flex;gap:6px;padding:8px 12px;overflow-x:auto;background:var(--panel);border-bottom:1px solid var(--line);
  position:sticky;top:49px;z-index:29;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{
  border:1px solid var(--line);background:transparent;border-radius:999px;padding:5px 13px;
  font-size:14px;white-space:nowrap;color:var(--muted);
}
nav button.active{background:var(--primary);border-color:var(--primary);color:#fff}

main{max-width:1080px;margin:0 auto;padding:14px 14px 64px}

/* ---------- 过滤条 ---------- */
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
input,select{
  font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:10px;
  padding:7px 10px;min-width:0;
}
input[type=date]{padding:6px 8px}
#q-word{flex:1 1 220px;min-width:160px}
button.primary{background:var(--primary);border:1px solid var(--primary);color:#fff;border-radius:10px;padding:7px 16px}
button.primary:disabled{opacity:.55;cursor:not-allowed}
button.ghost{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 12px}
button.icon-btn{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-weight:600}

/* ---------- 列表 ---------- */
.list-meta{color:var(--muted);font-size:13px;margin:2px 2px 10px}
.novel-grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.novel-card{
  display:flex;gap:11px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  padding:11px;box-shadow:var(--shadow);cursor:pointer;text-align:left;width:100%;
}
.novel-card:hover{border-color:var(--primary)}
.novel-card.shelf-card{cursor:default;padding:8px 10px 8px 11px}
/* 卡片里的操作按钮（移除 / 合并导出）：不跟着卡片高度拉伸 */
.novel-card.shelf-card > .ghost,.novel-card.shelf-card > .rm{align-self:center;flex:0 0 auto}
.novel-card .card-open{display:flex;gap:11px;flex:1;min-width:0;background:none;border:0;padding:0;
  text-align:left;cursor:pointer;color:inherit;font:inherit}
.novel-card .card-open:hover .novel-title{color:var(--primary)}
.rm{color:var(--danger);font-size:12px;border:1px solid var(--line);border-radius:8px;padding:5px 10px;
  background:var(--panel);flex:0 0 auto;align-self:center}
.rm.plain{color:var(--primary);border-color:var(--primary);text-decoration:none;
  display:inline-flex;align-items:center;justify-content:center}
.cover{position:relative;width:56px;height:76px;flex:0 0 auto;border-radius:9px;overflow:hidden;background:var(--primary-soft);
  display:grid;place-items:center;font-size:22px;font-weight:700;color:var(--primary)}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.novel-body{min-width:0;flex:1}
.novel-title{font-weight:600;font-size:15px;line-height:1.35;margin-bottom:4px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.novel-sub{color:var(--muted);font-size:12.5px;display:flex;flex-wrap:wrap;gap:6px;margin-bottom:5px}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.tag{font-size:11.5px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:1px 7px;white-space:nowrap}
.badge{font-size:11px;background:var(--primary-soft);color:var(--primary);border-radius:6px;padding:1px 6px}
.empty{color:var(--muted);text-align:center;padding:34px 12px}
.open-actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:16px}
.open-actions button{min-height:40px}
button.more{display:block;margin:16px auto 0;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 22px}

/* ---------- 章节列表 / 书架 ---------- */
.chapter-list{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.chapter{
  display:flex;align-items:center;gap:10px;padding:11px 13px;border-bottom:1px solid var(--line);cursor:pointer;
  text-align:left;width:100%;background:transparent;border-left:0;border-right:0;border-top:0;
}
.chapter:last-child{border-bottom:0}
.chapter:hover{background:var(--primary-soft)}
.chapter .idx{color:var(--muted);font-size:12.5px;flex:0 0 auto;font-variant-numeric:tabular-nums}
.chapter .c-title{flex:1;min-width:0;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chapter .c-meta{color:var(--muted);font-size:12px;flex:0 0 auto}
.chapter.current{background:var(--primary-soft)}
.chapter.current .c-title{color:var(--primary);font-weight:600}

/* ---------- 阅读器 ---------- */
.reader-bar{
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px;
  position:sticky;top:97px;z-index:20;background:var(--bg);padding:6px 0;border-bottom:1px solid var(--line);
}
.reader-bar .spacer{flex:1}
#reader{
  --fs:18px; --lh:1.95; --w:760px;
  max-width:min(var(--w),100%);margin:0 auto;background:var(--panel);border:1px solid var(--line);
  border-radius:var(--r);padding:26px 22px 34px;box-shadow:var(--shadow);
}
#reader h2{margin:0 0 8px;font-size:21px;line-height:1.4}
.reader-meta{color:var(--muted);font-size:13px;display:flex;flex-wrap:wrap;gap:7px;margin-bottom:8px;align-items:center}
.reader-tags{margin-bottom:6px}
.rule{height:1px;background:var(--line);margin:14px 0 18px}
#reader-text{font-size:var(--fs);line-height:var(--lh);white-space:pre-wrap;word-break:break-word;
  font-family:"Songti SC","Noto Serif CJK SC",Georgia,"Source Han Serif SC",serif}
body.font-sans #reader-text{font-family:inherit}
#reader-text p{margin:0 0 1em}
/* 正文里的插图、章节标题、分页与 ruby */
.novel-fig{margin:14px 0;text-align:center}
.novel-fig img{display:block;max-width:100%;height:auto;margin:0 auto;border-radius:10px;background:var(--bg)}
.novel-fig figcaption{color:var(--muted);font-size:12px;margin-top:6px}
.novel-fig .ph{color:var(--muted);font-size:13px;border:1px dashed var(--line);border-radius:10px;padding:14px 10px;background:var(--bg)}
.novel-fig.missing .ph{border-style:solid;border-color:var(--warn-line);color:var(--warn)}
.novel-chapter{font-size:1.06em;font-weight:700;margin:1.4em 0 .6em;border-left:3px solid var(--primary);padding-left:9px;line-height:1.5}
.novel-page-sep{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px;margin:1.2em 0;font-family:inherit}
.novel-page-sep::before,.novel-page-sep::after{content:"";height:1px;background:var(--line);flex:1}
#reader-text ruby rt{font-size:.5em;color:var(--muted)}
#reader-text a{color:var(--primary)}
.reader-diag{margin-top:20px;border:1px dashed var(--danger);border-radius:10px;padding:10px 12px;color:var(--muted);font-size:13px}
.reader-diag pre{white-space:pre-wrap;word-break:break-all;font-size:12px;background:var(--bg);border-radius:8px;padding:8px;margin:8px 0 0;max-height:220px;overflow:auto}
.chapter-nav{display:flex;gap:8px;align-items:center;justify-content:center;margin:16px auto 0;max-width:760px;flex-wrap:wrap}
.chapter-nav button{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 14px}
.chapter-nav button:disabled{opacity:.45;cursor:not-allowed}
.chapter-nav select{max-width:260px}

/* ---------- 抽屉（目录 / 设置） ---------- */
.drawer{
  position:fixed;z-index:60;background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);
  left:50%;transform:translateX(-50%);bottom:0;width:min(560px,100%);max-height:72vh;overflow:auto;
  border-radius:16px 16px 0 0;padding:14px 14px 22px;
}
.drawer h3{margin:2px 0 10px;font-size:15px}
.drawer .row{display:flex;align-items:center;gap:10px;margin:10px 0;font-size:14px}
.drawer .row label{width:74px;color:var(--muted);flex:0 0 auto}
.drawer .row input[type=range]{flex:1}
.drawer .row .val{width:52px;text-align:right;color:var(--muted);font-size:12.5px}
.drawer .row select{flex:1}
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:55}
.drawer-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}

/* ---------- 提示 / 遮罩（遮罩与 loading 刻意不跟随主题） ---------- */
#toast{
  position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:90;background:var(--toast-bg);color:var(--toast-fg);
  padding:9px 16px;border-radius:10px;font-size:14px;max-width:88vw;text-align:center;
}
#loading{position:fixed;inset:0;z-index:80;display:grid;place-items:center;background:rgba(0,0,0,.28)}
/* ---------- 旧版服务提示条 ---------- */
#ver-banner{
  margin:0 0 12px;padding:10px 12px;border-radius:10px;font-size:13.5px;line-height:1.55;
  background:var(--warn-soft);color:var(--warn);border:1px solid var(--warn-line);
}
#loading .box{background:var(--panel);border-radius:12px;padding:16px 20px;display:flex;align-items:center;gap:11px;font-size:14px;box-shadow:var(--shadow)}
.spinner{width:18px;height:18px;border:2px solid var(--line);border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* ---------- 作者页 / 收藏 / 下载记录 / 本地书架 ---------- */
.grid-head{grid-column:1/-1;display:flex;align-items:center;gap:8px;margin:8px 2px 0;font-size:13px;color:var(--muted)}
.grid-head:first-child{margin-top:0}
.grid-head b{color:var(--text);font-weight:600;font-size:14px}
.grid-head .ln{flex:1;height:1px;background:var(--line)}
.user-head{display:flex;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);
  border-radius:var(--r);padding:12px;box-shadow:var(--shadow);margin-bottom:12px}
.user-head .u-avatar{width:64px;height:64px;border-radius:50%;object-fit:cover;flex:0 0 auto;background:var(--primary-soft);
  display:grid;place-items:center;font-size:24px;font-weight:700;color:var(--primary)}
.user-head .u-body{min-width:0;flex:1}
.user-head h2{margin:0 0 4px;font-size:18px;line-height:1.3;overflow:hidden;text-overflow:ellipsis}
.user-head .u-sub{color:var(--muted);font-size:12.5px;display:flex;flex-wrap:wrap;gap:8px}
.user-head .u-comment{color:var(--muted);font-size:13px;margin-top:6px;white-space:pre-wrap;word-break:break-word;max-height:4.6em;overflow:auto}
.user-head .u-act{display:flex;flex-direction:column;gap:6px;flex:0 0 auto}
button.ghost.on{border-color:var(--primary);color:var(--primary);background:var(--primary-soft)}
.hint{color:var(--muted);font-size:12.5px;margin:4px 2px 10px;line-height:1.55}
.hint.warn{color:var(--warn);background:var(--warn-soft);border:1px solid var(--warn-line);border-radius:9px;padding:7px 9px;word-break:break-word}
#set-lib-list{display:flex;flex-direction:column;gap:6px;margin:8px 0 2px}
#set-lib-list:empty{display:none}
#set-lib-list .dir{display:flex;align-items:center;gap:8px;font-size:13px;border:1px solid var(--line);border-radius:9px;padding:6px 9px}
#set-lib-list .dir span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:rtl;text-align:left}
#set-libdir-row input{flex:1;min-width:0}
.drawer hr{border:0;border-top:1px solid var(--line);margin:14px 0 10px}
.drawer h4{margin:0 0 4px;font-size:14px}

/* ---------- 移动端适配（主要使用场景是手机） ---------- */
@media (max-width:640px){
  /* 顶栏固定高度，配合 env(safe-area-inset-top) 适配刘海屏 / 全屏 PWA */
  header{height:calc(46px + env(safe-area-inset-top));padding:0 12px;padding-top:env(safe-area-inset-top);gap:8px}
  .logo{width:26px;height:26px;font-size:14px}
  .brand h1{font-size:15px}
  #auth-badge{font-size:11px;max-width:34vw;overflow:hidden;text-overflow:ellipsis}
  #btn-settings{min-height:44px}
  /* 触摸目标 ≥44px：搜索行 / 各来源参数行 / 加载榜单按钮 */
  #filters-search button,#filters-ranking button,#filters-follow button{min-height:44px}

  /* 导航改成贴底标签栏：拇指可达、不占首屏 */
  nav{
    position:fixed;left:0;right:0;bottom:0;top:auto;z-index:40;justify-content:space-between;
    padding:6px 8px calc(6px + env(safe-area-inset-bottom));
    border-bottom:0;border-top:1px solid var(--line);overflow:visible;
  }
  nav button{flex:1 1 0;min-height:44px;padding:4px 2px;font-size:12.5px;border:0;border-radius:10px}
  nav button.active{background:var(--primary-soft);color:var(--primary);border:0}

  main{padding:12px 12px calc(84px + env(safe-area-inset-bottom))}

  /* 表单：iOS 只在字号 ≥16px 时才不会放大整页 */
  input,select{font-size:16px;padding:9px 11px;min-height:42px}
  input[type=date]{padding:8px 10px}
  button.primary,button.ghost,button.icon-btn{min-height:42px}
  .filters{gap:8px;margin-bottom:10px}
  /* 首屏优先：「搜索类型 + 关键词 + 搜索 + 筛选」挤在一行，排序/日期收进 #adv-search */
  #q-kind{flex:0 0 auto;padding:10px 6px}
  #q-word{flex:1 1 0;min-width:0}
  #q-run,#adv-toggle{flex:0 0 auto;padding-left:13px;padding-right:13px}
  #adv-search select{flex:1 1 100%}
  #adv-search input[type=date]{flex:1 1 calc(50% - 4px)}
  #q-date{flex:1 1 100%}
  /* 榜单 / 关注：参数和按钮挤在一行 */
  #filters-ranking select,#filters-follow select{flex:1 1 auto}
  #q-run-rank,#q-run-follow{flex:0 0 auto;padding-left:13px;padding-right:13px}

  /* 列表：单列 + 更大的封面与点击区域 */
  .novel-grid{grid-template-columns:1fr;gap:10px}
  .novel-card{padding:12px;gap:12px}
  .cover{width:64px;height:88px;font-size:24px}
  .novel-title{font-size:15.5px}
  .chapter{padding:13px;min-height:50px}
  /* 触控目标统一到 44px（iOS 建议） */
  .rm{padding:9px 12px;min-height:44px}
  button.more,.open-actions button{min-height:44px;padding:10px 22px}

  /* 阅读页工具条：不换行、可横向滑动，避免遮挡正文 */
  .reader-bar{top:calc(46px + env(safe-area-inset-top));flex-wrap:nowrap;overflow-x:auto;gap:6px;
    padding:6px 0;scrollbar-width:none}
  .reader-bar::-webkit-scrollbar{display:none}
  .reader-bar .spacer{display:none}
  .reader-bar button{flex:0 0 auto;min-height:44px;padding:9px 12px;font-size:13px}
  #reader{padding:18px 14px 24px;border-radius:12px;max-width:100%}
  #reader h2{font-size:19px}
  .rule{margin:12px 0 14px}
  .chapter-nav{gap:6px;max-width:100%;margin-top:14px}
  .chapter-nav select{flex:1 1 100%;max-width:100%;order:-1}
  .chapter-nav button{flex:1 1 0;min-height:44px;padding:8px 6px;font-size:13.5px}

  /* 抽屉：底部浮层，抬高到贴底导航之上 */
  .drawer{
    left:0;transform:none;width:100%;bottom:calc(58px + env(safe-area-inset-bottom));
    border-radius:14px 14px 0 0;max-height:76vh;padding:14px 14px 18px;
  }
  .drawer .row{margin:12px 0;gap:8px}
  .drawer .row label{width:56px}
  .drawer .row input[type=range]{height:30px}
  .drawer .row .val{width:46px}
  .drawer-actions button{flex:1;min-height:44px}

  #toast{bottom:calc(72px + env(safe-area-inset-bottom));max-width:92vw}
}
</style>
</head>
<body>

<header>
  <div class="brand">
    <span class="logo">書</span>
    <h1>Pixiv 小说阅读器</h1>
  </div>
  <div class="hdr-right">
    <span id="auth-badge">检查登录状态…</span>
    <button class="icon-btn" id="btn-settings" title="阅读设置" aria-label="阅读设置">Aa</button>
  </div>
</header>

<nav id="nav" aria-label="内容来源">
  <button data-source="ranking" class="active">榜单</button>
  <button data-source="recommended">推荐</button>
  <button data-source="follow">关注</button>
  <button data-source="watchlist">追更</button>
  <button data-source="bookmarks">收藏</button>
  <button data-source="shelf">书架</button>
</nav>

<main>
  <div id="ver-banner" hidden></div>
  <!-- ============ 列表 ============ -->
  <section id="view-list">
    <div class="filters" id="filters-search">
      <select id="q-kind" aria-label="搜索类型">
        <option value="novel">作品</option>
        <option value="user">作者</option>
      </select>
      <input id="q-word" type="search" placeholder="搜索小说：关键词 / 标签，回车即搜" aria-label="搜索关键词或标签" autocomplete="off" />
      <button class="primary" id="q-run">搜索</button>
      <button class="ghost" id="adv-toggle" aria-expanded="false" aria-controls="adv-search">筛选 ▾</button>
    </div>
    <div class="filters" id="adv-search" hidden>
      <select id="q-sort" aria-label="排序方式">
        <option value="date_desc">最新</option>
        <option value="date_asc">最旧</option>
        <option value="popular_desc">热门（需会员）</option>
      </select>
      <input id="q-start" type="date" title="起始日期（可留空）" aria-label="起始日期" />
      <input id="q-end" type="date" title="结束日期（可留空）" aria-label="结束日期" />
      <input id="q-date" type="date" title="榜单日期（留空为今天）" aria-label="榜单日期" />
    </div>

    <div class="filters" id="filters-ranking" hidden>
      <select id="q-mode" aria-label="榜单模式">
        <option value="day">日榜</option>
        <option value="week">周榜</option>
        <option value="month">月榜</option>

<script>
"use strict";
/* =====================================================================
 * Pixiv Bridge 小说阅读器（单文件，无构建步骤）
 * 数据全部来自本机 Pixiv Bridge 接口（/api/...），不直连 Pixiv。
 * ===================================================================== */

const $ = (id) => document.getElementById(id);
// 复用一个 div 做转义：一次列表渲染要调几十次，不值得每次新建节点
const escDiv = document.createElement("div");
const esc = (value) => {
  escDiv.textContent = value === null || value === undefined ? "" : String(value);
  return escDiv.innerHTML;
};
const num = (v) => (typeof v === "number" && isFinite(v) ? v : null);
const fmtNum = (n) => (n === null ? "" : n >= 10000 ? (n / 10000).toFixed(1).replace(/\.0$/, "") + " 万" : String(n));
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const SHELF_KEY = "pb.shelf.v1";
const SETTINGS_KEY = "pb.reader.v1";
const SERIES_FETCH_GAP = 700; // ms，配合接口 100 次/分的限流（约 85 次/分）
const DEFAULT_SETTINGS = { fs: 18, lh: 1.95, w: 760, theme: "light", font: "serif" };
const BASE_TITLE = "Pixiv 小说阅读器 · Pixiv Bridge";

const state = {
  source: "ranking",
  list: [],
  nextUrl: null,
  seriesKind: "novel",   // 列表项是小说（novel）、系列（series）还是作者（user）
  listScroll: 0,
  view: "list",
  current: null,         // 当前阅读的小说：{id, novel, text, shape, chapters, seriesDetail, chapterIndex}
  seriesView: null,      // 系列视图：{id, info:{detail, chapters}}
  userView: null,        // 作者页：{id, user, profile, source, novels, nextUrl}
  busy: false,
  lastDownload: 0,       // 上次开始导出的时间戳（防连点，见 downloadBlocked）
  loaded: false,         // 列表 view 是否已经成功加载过一次（用于深链返回时补加载）
  loadToken: 0,
  historyFile: "",       // 项目里阅读历史文件的路径（GET /api/history 返回，仅用于展示）
  myId: null,            // 当前登录用户 id（GET /api/auth/status，用于「我的关注」）
  favList: [],           // 本地收藏台账（GET /api/bookmarks）
  favIds: [],            // 上面那份的 id，便于 O(1) 判断按钮状态
  serverConfig: null,    // 项目里的用户配置（data/settings.json）
  library: null,         // 本地文件书架（GET /api/library）
  dlMarks: {},           // 下载记录："<bookId>#<chapterIndex>" → 记录（当前上下文用得上的一份）
  dlSeries: {},          // 下载记录：章节序号 → 记录（系列页用）
  dlGroups: [],          // 下载记录按系列名（merge_key）分组后的结果
};
let settings = loadSettings();

/* ---------------- 基础 UI ---------------- */
let toastTimer = null;
let authBadgeFresh = false;
function showToast(message, ms) {
  const el = $("toast");
  el.textContent = message;
  el.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.hidden = true; }, ms || 2600);
}
function showLoading(text) {
  $("loading-text").textContent = text || "加载中…";
  $("loading").hidden = false;
}
function hideLoading() { $("loading").hidden = true; }
function setMoreBusy(busy) {
  // 「加载更多」用按钮自身状态反馈，避免全屏遮罩盖住已经读到的列表
  const btn = $("btn-more");
  btn.disabled = !!busy;
  btn.textContent = busy ? "加载中…" : "加载更多";
  btn.setAttribute("aria-busy", busy ? "true" : "false");
}
let lastFocus = null;
function openDrawer(id) {
  lastFocus = document.activeElement;
  $("scrim").hidden = false;
  const drawer = $(id);
  drawer.hidden = false;
  const first = drawer.querySelector("input,select,button");
  if (first) first.focus({ preventScroll: true });
}
function closeDrawers() {
  const open = ["toc", "settings"].filter((id) => !$(id).hidden);
  if (!open.length) return;
  $("scrim").hidden = true;
  open.forEach((id) => { $(id).hidden = true; });
  if (lastFocus && document.contains(lastFocus)) lastFocus.focus({ preventScroll: true });
  lastFocus = null;
}
function trapTab(drawer, e) {
  // 让 Tab 在抽屉内循环，抽屉之外的元素拿不到焦点
  const items = [...drawer.querySelectorAll("button,input,select,textarea,a[href]")]
    .filter((el) => !el.disabled && !el.hidden);
  if (!items.length) return;
  const first = items[0], last = items[items.length - 1];
  const active = document.activeElement;
  if (!drawer.contains(active)) { e.preventDefault(); first.focus(); return; }
  if (e.shiftKey && active === first) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && active === last) { e.preventDefault(); first.focus(); }
}

/* ---------------- 接口调用 ---------------- */
async function callApi(path, params) {
  const url = new URL("/api" + path, location.origin);
  for (const [key, value] of Object.entries(params || {})) {
    if (value === undefined || value === null || value === "") continue;
    url.searchParams.set(key, value);
  }
  const resp = await fetch(url.toString());
  const raw = await resp.text();
  let body = null;
  try { body = raw ? JSON.parse(raw) : null; } catch (e) { body = raw; }
  if (!resp.ok) {
    const message = (body && body.error && body.error.message) || (typeof body === "string" ? body.slice(0, 200) : "") || ("HTTP " + resp.status);
    const err = new Error(message);
    err.status = resp.status;
    err.reason = body && body.error ? body.error.reason : "";
    err.body = body;
    throw err;
  }
  // 第一次「需要登录」的接口成功后，登录态才会真正生效（access token 是惰性换取的），
  // 此时刷新一次徽章；/auth/* 自身不算，否则状态查询会把这个机会先消耗掉。
  if (!authBadgeFresh && String(path).indexOf("/auth/") !== 0) {
    authBadgeFresh = true;
    loadAuthBadge();
  }
  return body;
}
/** 写接口（收藏 / 关注 / 追更 / 下载记录 / 项目配置）：统一 POST JSON 并解析错误。 */
async function callApiPost(path, body, method) {
  const resp = await fetch("/api" + path, {
    method: method || "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body || {}),
  });
  const raw = await resp.text();
  let data = null;
  try { data = raw ? JSON.parse(raw) : null; } catch (e) { data = raw; }
  if (!resp.ok) {
    let message = (data && data.error && data.error.message) || (data && data.detail) || ("HTTP " + resp.status);
    if (typeof message !== "string") message = JSON.stringify(message);
    const err = new Error(message);
    err.status = resp.status;
    err.reason = data && data.error ? data.error.reason : "";
    err.body = data;
    throw err;
  }
  if (!authBadgeFresh) { authBadgeFresh = true; loadAuthBadge(); }
  return data;
}
function errorHint(err) {
  const reason = (err && err.reason) || "";
  if (err && err.status === 401) return "需要登录：先运行 python get_token.py（或把 PIXIV_REFRESH_TOKEN 写进 .env）。";
  if (err && err.status === 429) return "请求过于频繁（接口限流），稍等一下再试。";
  if (err && (err.status === 502 || reason === "upstream_error" || reason === "connect_failed"))
    return "连不上 Pixiv：本机到上游的连接被阻断。参见 INSTALL.md，开启 ECH 或设置代理。";
  return "";
}
/** 桥自身的路由不存在时，FastAPI 回的是 {"detail":"Not Found"}，与上游错误体不同。 */
function isRouteMissing(err) {
  const body = err && err.body;
  const detail = body && (body.detail || (body.error && body.error.detail));
  return !!(err && err.status === 404 && typeof detail === "string" && /not\s*found/i.test(detail));
}
/** /api/novel/{id} 报 404 时，这个 id 很可能其实是「系列 id」：试着按系列打开。 */
async function tryOpenAsSeries(id, err) {
  if (!err || err.status !== 404 || isRouteMissing(err)) return false;
  try {
    const data = await callApi("/novel/series", { series_id: id });
    const detail = (data && (data.novel_series_detail || data.series)) || null;
    const chapters = (data && (data.novels || data.novel_series)) || [];
    if (!detail && !chapters.length) return false;
    showToast("这是系列 id，已按系列打开");
    location.hash = "#/series/" + id;
    return true;
  } catch (e) { return false; }
}
function diagLines(id, err, suffix) {
  let body = "";
  try { body = JSON.stringify(err && err.body).slice(0, 400); } catch (e) { body = String(err && err.body).slice(0, 400); }
  return [
    "时间: " + new Date().toLocaleString(),
    "页面: " + location.href,
    "接口: GET /api/novel/" + id + (suffix || ""),
    "HTTP: " + ((err && err.status) || "-"),
    "reason: " + ((err && err.reason) || "-"),
    "message: " + ((err && err.message) || "-"),
    "body: " + (body || "-"),
  ].join("\n");
}
/** 打不开小说时给可操作的说明 + 可复制的诊断信息，而不是只把错误原文丢在正文区。 */
function renderOpenError(id, err) {
  const status = err && err.status;
  const routeMissing = isRouteMissing(err);
  const blocks = [];
  let title = "打开失败";
  if (routeMissing) {
    title = "接口不存在（404）";
    blocks.push("正在运行的服务里没有 <b>/api/novel/" + esc(String(id)) + "</b> 这个接口。"
      + "<br />通常是<b>服务进程还是旧版本</b>：请停止 Pixiv Bridge、用最新代码重新启动，"
      + "然后刷新本页（手机上可下拉刷新）。");
    checkRoutes();
  } else if (status === 404) {
    title = "Pixiv 返回 404";
    blocks.push("上游找不到小说 <b>" + esc(String(id)) + "</b>。常见原因："
      + "<br />· 这个 id 其实是<b>系列 id</b>（上面已自动尝试按系列打开，若也失败说明系列同样取不到）"
      + "<br />· 作品已删除、转为私密或仅作者可见"
      + "<br />· R-18 等需要先在 Pixiv 上确认年龄的作品"
      + "<br /><br />可点工具条上的「Pixiv 原页」，用同一账号在网页版确认这本是否还在。");
  } else {
    const hint = errorHint(err);
    if (hint) blocks.push(esc(hint));
    blocks.push("错误信息：" + esc((err && err.message) || "未知错误"));
  }
  const diag = diagLines(id, err);
  $("reader-title").textContent = title;
  $("reader-meta").textContent = "";
  $("reader-tags").innerHTML = "";
  // 错误状态下也要让「Pixiv 原页」指向当前这本（否则会沿用上一个打开成功的 id）
  $("btn-pixiv").onclick = () => window.open("https://www.pixiv.net/novel/show.php?id=" + id, "_blank", "noopener");
  document.title = "打开失败 · Pixiv 小说阅读器";
  $("reader-text").innerHTML = '<div class="empty">' + blocks.join("<br /><br />") + '<div class="open-actions">'
    + (routeMissing ? "" : '<button class="ghost" id="open-as-series">把 id 当系列打开</button>')
    + '<button class="ghost" id="open-copy-diag">复制诊断信息</button></div></div>';
  $("reader-diag").hidden = false;
  $("reader-diag").innerHTML = "<div>诊断信息（反馈问题时请附上这段）：</div><pre>" + esc(diag) + "</pre>";
  const asSeries = $("open-as-series");
  if (asSeries) asSeries.addEventListener("click", () => { location.hash = "#/series/" + id; });
  bindDiagCopy(diag);
  showToast(title + "：" + ((err && err.message) || ""));
}

/** 「复制诊断信息」按钮：错误面板与正文错误面板共用。 */
function bindDiagCopy(diag) {
  const btn = $("open-copy-diag");
  if (!btn) return;
  btn.addEventListener("click", async () => {
    try { await navigator.clipboard.writeText(diag); showToast("诊断信息已复制"); }
    catch (e) { showToast("复制失败，请手动选择文本"); }
  });
}

/** 详情拿到了、正文却没取到：标题/作者/字数留在页面上，只说明正文的问题。 */
function renderTextError(id, err) {
  const status = err && err.status;
  const routeMissing = isRouteMissing(err);
  const blocks = [];
  let title = "正文取不到";
  if (routeMissing) {
    title = "正文接口不存在（404）";
    blocks.push("当前服务里没有 <b>/api/novel/" + esc(String(id)) + "/text</b> 这个接口，"
      + "通常是<b>服务进程还是旧版本</b>：请停止 Pixiv Bridge、用最新代码重新启动，然后刷新本页。");
    checkRoutes();
  } else if (status === 404) {
    title = "正文接口返回 404";
    blocks.push("这本书的信息能取到（作者、字数、标签都在上面），但正文接口拿不到内容。"
      + "<br />Pixiv 已在 2024 年 2 月的 App 更新里删掉了 <b>/v1/novel/text</b>，旧接口只会回一句"
      + "「Specified end-point doesn't exist」；本服务已改用官方 iOS 客户端的 /webview/v2/novel 取正文。"
      + "<br />若这里仍报 404，多半是这本作品本身看不了：R-18 未在 Pixiv 确认年龄、本文非公开、或已被删除。");
  } else {
    const hint = errorHint(err);
    if (hint) blocks.push(esc(hint));
    blocks.push("错误信息：" + esc((err && err.message) || "未知错误"));
  }
  const diag = diagLines(id, err, "/text");
  $("reader-title").textContent = title;
  $("reader-text").innerHTML = '<div class="empty">' + blocks.join("<br /><br />")
    + '<div class="open-actions"><button class="ghost" id="open-copy-diag">复制诊断信息</button></div></div>';
  $("reader-diag").hidden = false;
  $("reader-diag").innerHTML = "<div>诊断信息（反馈问题时请附上这段）：</div><pre>" + esc(diag) + "</pre>";
  bindDiagCopy(diag);
  document.title = "正文取不到 · Pixiv 小说阅读器";
  showToast(title);
}

/* ---------------- 设置 ---------------- */
function loadSettings() {
  try {
    const saved = JSON.parse(localStorage.getItem(SETTINGS_KEY) || "{}");
    return Object.assign({}, DEFAULT_SETTINGS, saved && typeof saved === "object" ? saved : {});
  } catch (e) { return Object.assign({}, DEFAULT_SETTINGS); }
}
function applySettings() {
  $("reader").style.setProperty("--fs", settings.fs + "px");
  $("reader").style.setProperty("--lh", String(settings.lh));
  $("reader").style.setProperty("--w", settings.w + "px");
  document.body.classList.toggle("theme-sepia", settings.theme === "sepia");
  document.body.classList.toggle("theme-dark", settings.theme === "dark");
  document.body.classList.toggle("font-sans", settings.font === "sans");
  $("set-fs").value = settings.fs; $("set-fs-val").textContent = settings.fs + "px";
  $("set-lh").value = settings.lh; $("set-lh-val").textContent = Number(settings.lh).toFixed(2);

/* ---------------- 书架（localStorage） ---------------- */
function loadShelf() {
  try {
    const saved = JSON.parse(localStorage.getItem(SHELF_KEY) || "[]");
    return Array.isArray(saved) ? saved : [];
  } catch (e) { return []; }
}
function saveShelf(items) {
  try { localStorage.setItem(SHELF_KEY, JSON.stringify(items.slice(0, 200))); } catch (e) { /* ignore */ }
}
function touchShelf(novel, patch) {
  if (!novel || !novel.id) return;
  const id = Number(novel.id);
  const items = loadShelf();
  const idx = items.findIndex((it) => Number(it.id) === id);
  const series = novel.series || {};
  const base = {
    id: id,
    title: novel.title || ("小说 " + id),
    user: (novel.user && novel.user.name) || "",
    seriesId: series.id ? Number(series.id) : null,
    seriesTitle: series.title || "",
    at: Date.now(),
  };
  const item = Object.assign({}, idx >= 0 ? items[idx] : {}, base, patch || {});
  if (idx >= 0) items.splice(idx, 1);
  items.unshift(item);
  saveShelf(items);
  // 只在书架列表可见时重绘：在阅读页里滚动保存进度也会走到这里，
  // 而 renderShelf() 会 showView("list")，那样会把正在读的书踢回列表。
  if (state.view === "list" && state.source === "shelf") renderShelf();

}
function shelfProgressPct(item) {

}
function fmtWhen(at) {
  const ms = Number(at || 0);
  if (!ms) return "";
  const d = new Date(ms);
  const now = new Date();
  const pad = (n) => (n < 10 ? "0" + n : String(n));
  const hm = pad(d.getHours()) + ":" + pad(d.getMinutes());
  if (d.toDateString() === now.toDateString()) return "今天 " + hm;
  return pad(d.getMonth() + 1) + "-" + pad(d.getDate()) + " " + hm;
}

/* ---------------- 阅读历史（项目目录下的 history.jsonl） ----------------
   本机 localStorage 仍然照写（离线可用、刷新立刻有），同时把「读完读到哪」
   写进项目里的 history.jsonl：换浏览器、清了浏览器数据也不会丢，
   个人使用、不区分用户，文件可以由用户自己备份或删除。
   写入很克制：同一本书最快 15 秒一条，离页时再补一条（sendBeacon）。 */
const HISTORY_MIN_GAP = 15000;
let historySentAt = 0;
let historyLastKey = "";
function historyEntry(novel, extra) {
  const cur = state.current || {};
  const series = (novel && novel.series) || {};
  const chapters = (cur.chapters && cur.chapters.length) ? cur.chapters : [];
  const id = Number((novel && novel.id) || 0);
  const shelfItem = loadShelf().find((it) => Number(it.id) === id);
  const progress = typeof cur.progress === "number" ? cur.progress
    : (shelfItem && typeof shelfItem.progress === "number" ? shelfItem.progress : null);
  // 只有系列章节才写「读到第几章」；单篇的 -1 这类内部标记不落到文件里。
  const seriesId = series.id ? Number(series.id) : (cur.seriesId || (shelfItem && shelfItem.seriesId) || null);
  const chapterIndex = seriesId
    ? (cur.chapterIndex >= 0 ? cur.chapterIndex : (shelfItem && shelfItem.chapterIndex >= 0 ? shelfItem.chapterIndex : null))
    : null;
  return Object.assign({
    id: id,
    title: (novel && novel.title) || "",
    user: (novel && novel.user && novel.user.name) || "",
    series_id: seriesId,
    series_title: series.title || "",
    chapter_index: chapterIndex,
    chapters: chapters.length || null,
    progress: progress,
    read_at: new Date().toISOString(),
  }, extra || {});
}
function postHistory(entry, force) {
  if (!entry || !entry.id) return;
  const now = Date.now();
  const key = entry.id + "|" + entry.progress + "|" + entry.chapter_index;
  if (!force) {
    if (key === historyLastKey && now - historySentAt < HISTORY_MIN_GAP) return;
    if (now - historySentAt < 3000) return;
  }
  historySentAt = now;
  historyLastKey = key;
  try {
    // keepalive 让请求在「切页/关标签」时也能发出去（体积很小）。
    fetch("/api/history", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(entry),
      keepalive: true,
    }).catch(() => { /* 服务是旧版/离线：localStorage 里还有一份 */ });
  } catch (e) { /* 忽略 */ }
}
function beaconHistory(entry) {
  if (!entry || !entry.id) return;
  const key = entry.id + "|" + entry.progress + "|" + entry.chapter_index;
  const now = Date.now();
  // beforeunload 和 pagehide 会连着触发，内容一样就只留一条。
  if (key === historyLastKey && now - historySentAt < 3000) return;
  historyLastKey = key;
  historySentAt = now;
  // 拿不到 sendBeacon（少见）时退回普通请求，keepalive 一样能在离页时发出。
  if (!navigator.sendBeacon) { postHistory(entry, true); return; }
  try {
    navigator.sendBeacon("/api/history", new Blob([JSON.stringify(entry)], { type: "application/json" }));
  } catch (e) { /* 忽略 */ }
}
function historyMetaText(count) {
  const file = state.historyFile || "";
  if (!file) return count + " 本 · 阅读历史只在本机浏览器里";
  const name = file.split(/[\\/]/).pop() || file;
  return count + " 本 · 阅读历史写入项目里的 " + name;
}
/** 启动时把项目里的历史并进书架：换浏览器/清了数据也能看到「最近在读」。 */
async function hydrateHistory() {
  let data = null;
  try {
    const resp = await fetch("/api/history?limit=200", { cache: "no-store" });
    data = resp.ok ? await resp.json() : null;
  } catch (e) { data = null; }
  if (!data || !Array.isArray(data.entries)) return;
  state.historyFile = data.file || "";
  const items = loadShelf();
  let changed = false;
  data.entries.forEach((entry) => {
    const id = Number(entry.id);
    if (!id) return;
    const at = Date.parse(entry.read_at || "") || Date.now();
    const idx = items.findIndex((it) => Number(it.id) === id);
    if (idx < 0) {
      items.push({
        id: id,
        title: entry.title || ("小说 " + id),
        user: entry.user || "",
        seriesId: entry.series_id || null,
        seriesTitle: entry.series_title || "",
        progress: typeof entry.progress === "number" ? entry.progress : 0,
        chapterIndex: entry.chapter_index,
        at: at,
        fromHistory: true,
      });
      changed = true;
      return;
    }
    const local = items[idx];
    // 服务器上的记录可能更新（比如换了浏览器读到更后面）：只补更新的部分，不覆盖本机书名。
    if (typeof entry.progress === "number" && at >= Number(local.at || 0) &&
        Number(local.progress || 0) !== Number(entry.progress)) {
      local.progress = entry.progress;
      local.at = at;
      changed = true;
    }
  });
  if (changed) {
    items.sort((a, b) => Number(b.at || 0) - Number(a.at || 0));
    saveShelf(items);
  }
  if (state.view === "list" && state.source === "shelf") renderShelf();
}

/* ---------------- 收藏（上游 + 项目里的 bookmarks.jsonl） ----------------
   pixiv 的 app 接口只有收藏的「加 / 删」，没有「列出我收藏的小说」，所以点收藏时

/* ---------------- 下载记录（项目里的 downloads.jsonl） ----------------
   粒度是「书 + 章节」：主键 bookId#chapterIndex，所以同一系列名下两个不同的
   「第一章」（两个不同 book_id）是两条互不覆盖的记录。同一个 merge_key
   （系列名归一化）下的章节可以合并成一个 EPUB 导出。 */
const MERGE_KEY_MAX = 120;
function mergeKeyOf(novel) {
  const series = (novel && novel.series) || {};
  const title = String((series.title || (novel && novel.title) || "")).trim();
  return title.replace(/\s+/g, "").toLowerCase().slice(0, MERGE_KEY_MAX);
}
function mergeTitleOf(novel) {
  const series = (novel && novel.series) || {};
  return series.title || (novel && novel.title) || "未命名";
}
async function refreshDownloadMarks(seriesId) {
  let data = null;
  try { data = await callApi("/downloads", Object.assign({ limit: 500 }, seriesId ? { series_id: seriesId } : {})); }
  catch (err) { return null; }
  state.dlAll = (data && data.entries) || [];
  state.dlMarks = {};
  state.dlAll.forEach((e) => { state.dlMarks[e.book_id + "#" + (e.chapter_index || 0)] = e; });
  state.dlSeries = (data && data.series) || {};
  state.dlGroups = groupDownloads(state.dlAll, mergeSeriesOn());
  return data;
}
/** 按系列名归组（可在配置里关掉：关掉后同一个系列名下的不同系列各成一组）。 */
function groupDownloads(entries, mergeByName) {
  const byName = mergeByName === undefined ? true : !!mergeByName;
  const groups = new Map();
  (entries || []).forEach((e) => {
    const key = byName
      ? (e.merge_key || mergeKeyOf({ series: { title: e.series_title }, title: e.title }))
      : ("series:" + (e.series_id || ("book:" + e.book_id)));
    if (!groups.has(key)) groups.set(key, { key: key, title: e.series_title || e.title || key, author: e.user || "", entries: [], at: "" });
    const group = groups.get(key);
    group.entries.push(e);
    if (String(e.at || "") > String(group.at || "")) group.at = e.at || "";
  });
  const list = [...groups.values()];
  list.forEach((group) => {
    group.entries.sort((a, b) => (a.chapter_index || 0) - (b.chapter_index || 0) || String(a.title).localeCompare(String(b.title)));
    // 同一章号出现多次 = 同名的两个系列各有一个「第 N 章」（用户明确提过「一个系列下两个不同的第一章」）。
    // 章号相同的那些记录在卡片上额外标出 book_id，提示里按章号报个数，免得把「第二章重了」也说成第一章。
    const byIndex = new Map();
    group.entries.forEach((e) => {
      const i = chapterIndexOf(e);
      byIndex.set(i, (byIndex.get(i) || 0) + 1);
    });
    group.dupeIndexes = [...byIndex.entries()].filter((pair) => pair[1] > 1).sort((a, b) => a[0] - b[0]);
    group.dupes = new Set(group.entries
      .filter((e) => (byIndex.get(chapterIndexOf(e)) || 0) > 1)
      .map((e) => Number(e.book_id)));
  });
  return list.sort((a, b) => String(b.at).localeCompare(String(a.at)));
}
function chapterIndexOf(entry) { return Math.max(0, Number(entry.chapter_index || 0)); }
function chapterLabelOf(entry, index) {
  const no = "第 " + (index === undefined ? chapterIndexOf(entry) + 1 : index + 1) + " 章";
  const name = entry.chapter_title || entry.title || "";
  return no + (name && name !== entry.title ? "　" + name : "");
}
async function recordDownload(entry) {
  try { await callApiPost("/downloads", entry); }
  catch (err) { /* 记录失败不影响已经导出的文件 */ }
}
function downloadRecordOf(opts) {
  return {
    book_id: Number(opts.bookId),
    chapter_index: Number(opts.chapterIndex || 0),
    chapter_id: Number(opts.chapterId || opts.bookId),
    chapter_title: opts.chapterTitle || "",
    title: opts.title || "",
    user: opts.user || "",
    series_id: opts.seriesId ? Number(opts.seriesId) : null,
    series_title: opts.seriesTitle || "",
    merge_key: opts.mergeKey || "",

/** 系列是否已经整本下载过（用于「跳过已下载」）。 */
function seriesFullyDownloaded(chapters) {
  if (!chapters || !chapters.length) return false;
  return chapters.every((chapter, i) => {
    const mark = state.dlSeries[String(i)] || state.dlMarks[chapter.id + "#" + i];
    return !!mark;
  });
}

  const cfg = (state.serverConfig && state.serverConfig.config) || {};
  return cfg.skip_downloaded !== false;
}
function mergeSeriesOn() {
  const cfg = (state.serverConfig && state.serverConfig.config) || {};

}
/** 把一组「同系列名」的下载记录合并成一个 EPUB（两个不同的第一章都各占一章）。 */
async function downloadMergeGroup(group) {
  if (downloadBlocked()) return;
  if (!group || !group.entries.length) return;
  state.busy = true;
  try {
    const entries = group.entries;
    const units = [];
    const failed = [];
    for (let i = 0; i < entries.length; i++) {
      const entry = entries[i];
      const label = chapterLabelOf(entry) + (group.dupes.has(entry.book_id) ? "（#" + entry.book_id + "）" : "");
      showLoading("合并导出 " + (i + 1) + " / " + entries.length + " 章…");
      try {
        const content = await fetchContentWithRetry(entry.book_id);
        units.push({ title: label, raw: content.text, images: content.images });
      } catch (err) {
        units.push({ title: label, raw: "", images: {}, html: '<p class="ph">（这一章没取到正文）</p>' });
        failed.push(label + "（" + err.message + "）");
      }
      if (i < entries.length - 1) await sleep(SERIES_FETCH_GAP);
    }
    if (!units.some((unit) => unit.raw)) { showToast("合并导出失败：所有章节都没取到正文"); return; }
    const notes = [];
    if (failed.length) notes.push("本次未取到正文的章节：" + failed.join("；"));
    notes.push("按系列名「" + group.title + "」合并 " + entries.length + " 章。");
    showLoading("正在准备 EPUB…");
    const result = await buildBookEpub({
      title: group.title,
      author: group.author || "",
      units: units,
      head: ["《" + group.title + "》", "作者：" + (group.author || "未知"), "共 " + entries.length + " 章（按系列名合并）"],
      notes: notes,
    });
    const name = safeFileName(group.title, "（合并" + entries.length + "章）");
    state.lastDownload = Date.now();
    downloadBlob(name, result.blob);
    showToast("已导出合并 EPUB：" + name + (failed.length ? "（缺 " + failed.length + " 章）" : ""));
  } catch (err) {
    showToast("合并导出失败：" + err.message);
  } finally {
    state.busy = false;
    hideLoading();
  }
}

/* ---------------- 项目配置与本地书架（data/settings.json + 目录扫描） ---------------- */

  try { state.library = await callApi("/library"); }
  catch (err) { state.library = null; }
  return state.library;
}

}
function avatarUrlOf(user) {
  const urls = (user && user.profile_image_urls) || {};

}
function userCardHtml(item) {
  const preview = userPreviewOf(item);
  const user = preview.user || {};
  const subs = [];
  if (user.account) subs.push("@" + esc(user.account));
  if (Array.isArray(preview.novels)) subs.push(preview.novels.length + " 部小说");
  else if (num(preview.novels) !== null) subs.push(fmtNum(preview.novels) + " 部小说");
  if (user.is_followed) subs.push("已关注");

      : "") + "</span>" +
    '<span class="novel-body">' +
      '<span class="novel-title">' + esc(name) + "</span>" +
      '<span class="novel-sub">' + subs.map((s) => "<span>" + s + "</span>").join("") + "</span>" +
    "</span></button>";

async function userMore() {
  const uv = state.userView;
  if (!uv || !uv.nextUrl) return;
  const token = ++state.loadToken;
  setMoreBusy(true);
  try {
    if (uv.kind === "following") {
      const data = await callApi("/next", { url: uv.nextUrl });
      if (token !== state.loadToken) return;
      const items = (data && (data.user_previews || data.users)) || [];
      uv.items = uv.items.concat(items);
      renderUserCards(uv.items);
      uv.nextUrl = (data && data.next_url) || null;
      $("user-meta").textContent = "共 " + uv.items.length + " 人" + (uv.nextUrl ? "（可继续加载）" : "");

      if (token !== state.loadToken) return;
      const items = (data && data.novels) || [];
      uv.items = uv.items.concat(items);

    showToast("加载失败：" + err.message);

/* ---------------- 文本归一化 ---------------- */
function looksLikeHtml(value) { return /<\/?[a-z!][\s\S]*>/i.test(value); }
function htmlToText(html) {
  let doc;
  try { doc = new DOMParser().parseFromString(html, "text/html"); }
  catch (e) { return html; }
  doc.querySelectorAll("rt, rp").forEach((el) => el.remove());            // 去掉振り仮名
  // 正文若是 HTML 形状，<img> 也当成插图保留下来（转成标记，交给 parseNovelText 处理）
  doc.querySelectorAll("img").forEach((el) => el.replaceWith("\n[[imgurl:" + (el.getAttribute("src") || "") + "]]\n"));
  doc.querySelectorAll("br").forEach((el) => el.replaceWith("\n"));
  doc.querySelectorAll("p, div, li, h1, h2, h3, h4, blockquote, section").forEach((el) => el.append("\n"));
  const text = doc.body ? doc.body.textContent || "" : html;
  return text.replace(/\r\n?/g, "\n").replace(/[ \t\u00a0]+/g, " ").replace(/[ \t]+\n/g, "\n").replace(/\n{3,}/g, "\n\n").trim();
}
function normalizeText(value) {
  const text = String(value == null ? "" : value).replace(/\r\n?/g, "\n");
  if (looksLikeHtml(text)) return htmlToText(text);
  return text.replace(/[ \t]+\n/g, "\n").replace(/\n{3,}/g, "\n\n").trim();
}
/** 上游 /v1/novel/text 的确切结构未在文档中固定，这里对多种形状做容错。 */
function extractText(payload) {
  const KEYS = ["novel_text", "text", "content", "body", "novel_content"];
  if (typeof payload === "string") {
    const text = normalizeText(payload);
    return { text: text, shape: text ? "raw-string" : "unknown" };
  }
  if (payload && typeof payload === "object") {
    for (const key of KEYS) {
      const value = payload[key];
      if (typeof value === "string" && value.trim()) return { text: normalizeText(value), shape: key };
      if (value && typeof value === "object") {
        for (const inner of KEYS) {
          if (typeof value[inner] === "string" && value[inner].trim()) {
            return { text: normalizeText(value[inner]), shape: key + "." + inner };
          }
        }
      }
    }
  }
  return { text: "", shape: "unknown" };
}

/* ---------------- 正文标记：插图 / 章节 / 分页 / ruby / 链接 ----------------
   Pixiv 正文用的是标记语法（与官方 App 的 contentRegexp 一致）：
     [newpage]                   分页
     [chapter:标题]               章节标题
     [uploadedimage:ID]          作者随小说上传的图，URL 在 payload.novel_images[ID]
     [pixivimage:ID]             引用 pixiv 插画（多页写作 [pixivimage:ID-页码]）
     [[rb:汉字 > 假名]]           振り仮名
     [[jumpuri:标题 > url]]       外链
     [jump:N]                    跳到第 N 页
   另外 HTML 形状的正文里 <img> 会被 htmlToText 换成 [[imgurl:URL]]。 */
const NOVEL_MARKER_RE = /\[newpage\]|\[chapter:([^\]]*)\]|\[uploadedimage:([0-9]+)\]|\[pixivimage:([0-9]+)(?:-([0-9]+))?\]|\[\[rb:([^\]]*?)\s*>\s*([^\]]*?)\]\]|\[\[jumpuri:([^\]]*?)\s*>\s*([^\]]*?)\]\]|\[jump:([0-9]+)\]|\[\[imgurl:([^\]]+)\]\]/g;

function parseNovelText(raw) {
  const nodes = [];
  const text = String(raw == null ? "" : raw);
  const pushText = (value) => { if (value) nodes.push({ t: "text", v: value }); };
  NOVEL_MARKER_RE.lastIndex = 0;
  let last = 0;
  let m;
  while ((m = NOVEL_MARKER_RE.exec(text)) !== null) {
    pushText(text.slice(last, m.index));
    last = m.index + m[0].length;
    if (m[1] !== undefined) nodes.push({ t: "chapter", v: m[1].trim() });
    else if (m[2] !== undefined) nodes.push({ t: "img", kind: "uploaded", id: m[2] });
    else if (m[3] !== undefined) nodes.push({ t: "img", kind: "pixiv", id: m[3], page: m[4] ? parseInt(m[4], 10) : 0 });
    else if (m[5] !== undefined) nodes.push({ t: "ruby", v: m[5], r: m[6] });
    else if (m[7] !== undefined) nodes.push({ t: "link", v: m[7], href: m[8] });
    else if (m[9] !== undefined) nodes.push({ t: "jump", n: m[9] });
    else if (m[10] !== undefined) nodes.push({ t: "img", kind: "url", url: m[10] });
    else nodes.push({ t: "page" });
  }
  pushText(text.slice(last));
  return nodes;
}
/** 把标记换成可读纯文本（「复制全文」用）。 */
function novelPlainText(raw, images) {
  let n = 0;
  const out = String(raw == null ? "" : raw).replace(
    NOVEL_MARKER_RE,
    (all, chapter, upId, pixivId, pixivPage, rbWord, rbRuby, linkText, linkUrl, jumpN, imgUrl) => {
      if (chapter !== undefined) return "\n\n【" + chapter.trim() + "】\n\n";
      if (upId !== undefined) { n += 1; return "［插图 " + n + "］"; }
      if (pixivId !== undefined) { n += 1; return "［插图 " + n + "：pixiv " + pixivId + (pixivPage ? "-" + pixivPage : "") + "］"; }
      if (rbWord !== undefined) return rbRuby ? rbWord + "（" + rbRuby + "）" : rbWord;
      if (linkText !== undefined) return linkText + "（" + linkUrl + "）";
      if (jumpN !== undefined) return "［第 " + jumpN + " 页］";
      if (imgUrl !== undefined) { n += 1; return "［插图 " + n + "］"; }
      return "\n\n";   // [newpage]
    }
  );
  return out.replace(/[ \t]+\n/g, "\n").replace(/\n{3,}/g, "\n\n").replace(/^\n+/, "");
}
/* 图片映射在几种接口形状里叫法不同（网页版 textEmbeddedImages、 snake_case、
   桥归一化后的 novel_images），全部认下来：取正文插图时不能因为键名不同就当作没有图。 */
const NOVEL_IMAGE_KEYS = [
  "novel_images", "novelImages", "textEmbeddedImages", "text_embedded_images",
  "embeddedImages", "embedded_images", "novel_image", "images",
];
function extractImages(payload) {
  const shapes = [payload, payload && payload.novel, payload && payload.text, payload && payload.data];
  for (const shape of shapes) {
    if (!shape || typeof shape !== "object") continue;
    for (const key of NOVEL_IMAGE_KEYS) {
      const value = shape[key];
      if (value && typeof value === "object" && !Array.isArray(value)) return value;
    }
  }
  return {};
}
/** 插图 URL 各尺寸的键名在网页/App 两套命名里不同，这里统一取一张够清晰的。
    （桥会把 novel_images 归一化成 large/original/medium/thumb；这里兼容原始
    形状：旧版的 1200x1200 档位名、以及 original_image_url 这类网页键名。） */
function pickImageUrl(entry) {
  if (!entry) return "";
  if (typeof entry === "string") return entry;
  if (Array.isArray(entry)) {
    for (const item of entry) {
      const url = pickImageUrl(item);
      if (url) return url;
    }
    return "";
  }
  if (typeof entry !== "object") return "";
  const src = entry.urls || entry.image_urls || entry.imageUrls || entry;
  if (typeof src === "string") return src;
  if (!src || typeof src !== "object") {
    return entry.url || entry.src || entry.link || "";
  }
  return src.large || src["1200x1200"] || src.large_image_url || src.original ||
    src.original_image_url || src.originalImageUrl ||
    src.medium || src["480mw"] || src["540x540"] || src.medium_image_url ||
    src.thumb || src["128x128"] || src.square_medium_image_url || src.thumbnail_image_url ||
    src.url || src.src || "";
}
const illustCache = new Map();
function pickIllustUrl(illust, page) {
  if (!illust) return "";
  const pages = illust.meta_pages;
  if (page && Array.isArray(pages) && pages[page - 1]) return pickImageUrl(pages[page - 1].image_urls || pages[page - 1]);
  return pickImageUrl(illust.image_urls || illust.meta_single_page || illust);
}
async function resolvePixivImage(id, page) {
  let illust = illustCache.get(id);
  if (illust === undefined) {
    const data = await callApi("/illust/" + id);
    illust = (data && (data.illust || data.illust_detail)) || data;
    illustCache.set(id, illust);
  }
  return pickIllustUrl(illust, page);
}
function imgProxyUrl(url) { return "/img?url=" + encodeURIComponent(url); }
/** 正文里的一个插图块：先占位，拿到 URL 后再把 <img> 填进去。 */
function novelFigure(node, images, index) {
  const fig = document.createElement("figure");
  fig.className = "novel-fig pending";
  const ph = document.createElement("div");
  ph.className = "ph";
  ph.textContent = "插图 " + index + " 加载中…";
  const img = document.createElement("img");
  img.loading = "lazy";
  img.decoding = "async";
  img.alt = "插图 " + index;
  const caption = document.createElement("figcaption");
  const where = node.kind === "uploaded" ? "作者上传"
    : node.kind === "pixiv" ? ("pixiv 插画 " + node.id + (node.page ? " 第 " + node.page + " 页" : ""))
    : "图片";
  caption.textContent = "插图 " + index + " · " + where;
  const fail = (message) => {
    fig.classList.remove("pending");
    fig.classList.add("missing");
    if (img.parentNode) img.remove();
    ph.textContent = "插图 " + index + "：" + message + "。可点上方「Pixiv 原页」在原站查看。";
  };
  const setSrc = (url) => {
    if (!url) {
      // 报错里带上标记 id 与本页解析到的图片映射，方便反馈时定位（个人使用，不展示在正文里）。
      console.warn("[插图] 没有取到图片地址", node.kind, node.id, "已解析的图片键：", Object.keys(images || {}));
      if (node.kind === "uploaded") {
        const parsed = Object.keys(images || {}).length;
        fail("没有取到图片地址（正文里的 uploadedimage " + node.id + "，" +
          (parsed ? "本次解析到 " + parsed + " 张插图但都不匹配" : "本次没有解析到任何插图") + "）");
      } else {
        fail("没有取到图片地址（插画 " + node.id + "）");
      }
      return;
    }
    img.addEventListener("load", () => { if (ph.parentNode) ph.remove(); fig.classList.remove("pending"); });
    img.addEventListener("error", () => fail("图片加载失败"));
    img.src = imgProxyUrl(url);
    fig.insertBefore(img, ph);
    fig.appendChild(caption);
  };
  fig.appendChild(ph);
  if (node.kind === "uploaded") setSrc(pickImageUrl(images && (images[node.id] || images[String(node.id)])));
  else if (node.kind === "url") setSrc(node.url);
  else {
    resolvePixivImage(node.id, node.page)
      .then((url) => (url ? setSrc(url) : fail("没有取到图片地址（插画 " + node.id + "）")))
      .catch((err) => fail("插画信息取不到：" + ((err && err.message) || "未知错误")));
  }
  return fig;
}
/** 把归一化后的正文渲染成 DOM：纯文本走文本节点，插图/章节/分页/ruby 走元素。 */
function renderNovelText(raw, images) {
  const box = $("reader-text");
  box.innerHTML = "";
  const frag = document.createDocumentFragment();
  let index = 0;
  for (const node of parseNovelText(raw)) {
    if (node.t === "text") { frag.appendChild(document.createTextNode(node.v)); continue; }
    if (node.t === "chapter") {
      const h = document.createElement("h3");
      h.className = "novel-chapter";
      h.textContent = node.v;
      frag.appendChild(h);
    } else if (node.t === "page") {
      const sep = document.createElement("div");
      sep.className = "novel-page-sep";
      sep.textContent = "翻页";
      frag.appendChild(sep);
    } else if (node.t === "jump") {
      frag.appendChild(document.createTextNode("［第 " + node.n + " 页］"));
    } else if (node.t === "ruby") {
      const ruby = document.createElement("ruby");
      ruby.appendChild(document.createTextNode(node.v));
      const rt = document.createElement("rt");
      rt.textContent = node.r;
      ruby.appendChild(rt);
      frag.appendChild(ruby);
    } else if (node.t === "link") {
      const a = document.createElement("a");
      a.href = node.href;
      a.target = "_blank";
      a.rel = "noopener noreferrer";
      a.textContent = node.v;
      frag.appendChild(a);
    } else if (node.t === "img") {
      index += 1;
      frag.appendChild(novelFigure(node, images, index));
    }
  }
  box.appendChild(frag);
}

/* ---------------- 列表 ---------------- */
function showView(name) {
  state.view = name;
  for (const view of ["list", "series", "reader", "user"]) {
    $("view-" + view).hidden = view !== name;
  }

async function runQuery(source, more) {

  if (!more) { state.source = source; setFilters(); setNavActive(); }
  const token = ++state.loadToken;
  let path = "", params = {}, key = "novels";
  if (source === "search") {
    const word = $("q-word").value.trim();
    if ($("q-kind").value === "user") {
      path = "/search/user"; key = "user_previews";
      params = { word: word };
    } else {
      path = "/search/novel"; key = "novels";
      params = { word: word, sort: $("q-sort").value, start_date: $("q-start").value, end_date: $("q-end").value };
    }
  } else if (source === "ranking") {
    path = "/novel/ranking"; key = "novels";
    params = { mode: $("q-mode").value, date: $("q-date").value };
  } else if (source === "recommended") {
    path = "/novel/recommended"; key = "novels";
  } else if (source === "follow") {
    path = "/novel/follow"; key = "novels";
    params = { restrict: $("q-restrict").value };
  } else if (source === "watchlist") {
    path = "/watchlist/novel"; key = "novel_series";
  } else {
    return;

    const data = more
      ? await callApi("/next", { url: state.nextUrl })
      : await callApi(path, params);
    if (token !== state.loadToken || source !== state.source) return;
    const added = (data && (data[key] || data.novels || data.novel_series)) || [];
    state.list = (more ? state.list : []).concat(added);
    state.nextUrl = (data && data.next_url) || null;
    state.seriesKind = key === "novel_series" ? "series" : (key === "user_previews" ? "user" : "novel");
    state.loaded = true;
    // 翻页只追加新卡片：全量重建会让已加载的封面重新解码、丢掉滚动位置
    if (more && added.length) $("grid").insertAdjacentHTML("beforeend", added.map(cardHtml).join(""));

    $("list-meta").textContent = listMetaText(source);
    $("btn-more").hidden = !state.nextUrl;
  } catch (err) {
    const hint = errorHint(err);
    $("list-meta").textContent = "加载失败：" + err.message + (hint ? " — " + hint : "");
    if (!more) $("grid").innerHTML = '<div class="empty">加载失败：' + esc(err.message) + "</div>";
    showToast("加载失败：" + err.message);
  } finally {

}

async function loadText(novelId) {

/* ---------------- 阅读进度 ---------------- */
let saveTimer = null;
function progressMax() { return document.documentElement.scrollHeight - window.innerHeight; }
function saveProgress() {
  const cur = state.current;
  if (!cur || !cur.novel || cur.local || state.view !== "reader") return;
  // 正文还没渲染完就不要写进度：openReader 会先 scrollTo(0,0)，
  // 而浏览器在刷新时可能已经恢复了上一次的滚动位置，那一瞬间的 scroll 事件会把进度误写成 0。
  if (!cur.text) return;
  const max = progressMax();
  const p = max > 200 ? Math.min(1, Math.max(0, window.scrollY / max)) : 0;
  cur.progress = p;
  touchShelf(cur.novel, { progress: p, chapterIndex: cur.chapterIndex, seriesId: cur.seriesId || (cur.novel.series && cur.novel.series.id) || null });
  postHistory(historyEntry(cur.novel));   // 每 15 秒最多写一行（见 postHistory）
}
function restoreProgress(novelId) {
  const item = loadShelf().find((it) => Number(it.id) === Number(novelId));
  if (!item || !item.progress) return;
  const apply = () => {
    const max = progressMax();
    if (max > 200) window.scrollTo(0, Math.round(max * item.progress));
  };
  // 立刻恢复一次（正文此时已经渲染，读 scrollHeight 会强制同步布局），
  // 再等一帧补一次兜底：某些环境（后台标签页 / 无头浏览器）根本不会触发 rAF。
  apply();
  requestAnimationFrame(apply);
}
window.addEventListener("scroll", () => {
  if (state.view !== "reader") return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveProgress, 500);
}, { passive: true });

/* ---------------- 极简 ZIP 打包（只 store，不压缩） ----------------
   EPUB 就是一个 ZIP：`mimetype` 必须是第一个条目且不压缩，其余条目压不压缩随意。
   为了保持「单文件、零依赖」，这里手写最小 ZIP，不引 JSZip 之类的库。 */
const CRC_TABLE = (() => {
  const table = new Uint32Array(256);
  for (let n = 0; n < 256; n++) {
    let c = n;
    for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1;
    table[n] = c >>> 0;
  }
  return table;
})();
function crc32(bytes) {
  let c = 0xffffffff;
  for (let i = 0; i < bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xff] ^ (c >>> 8);
  return (c ^ 0xffffffff) >>> 0;
}
const utf8 = (str) => new TextEncoder().encode(str);
/** files: [{name, data: Uint8Array}]，第一个条目会被当成 mimetype（不压缩）。 */
function zipStore(files) {
  const now = new Date();
  const dosTime = ((now.getHours() << 11) | (now.getMinutes() << 5) | Math.floor(now.getSeconds() / 2)) & 0xffff;
  const dosDate = (((now.getFullYear() - 1980) << 9) | ((now.getMonth() + 1) << 5) | now.getDate()) & 0xffff;
  const body = [];
  const central = [];
  let offset = 0;
  for (const file of files) {
    const name = utf8(file.name);
    const data = file.data;
    // 文件名是 ASCII 就不置 UTF-8 标志位（mimetype 这一条尤其干净，OCF 对外层最挑）
    const flags = /^[\x20-\x7e]*$/.test(file.name) ? 0 : 0x0800;
    const crc = crc32(data);
    const local = new DataView(new ArrayBuffer(30));
    local.setUint32(0, 0x04034b50, true);
    local.setUint16(4, 20, true);      // version needed
    local.setUint16(6, flags, true);
    local.setUint16(8, 0, true);       // method 0 = store
    local.setUint16(10, dosTime, true);
    local.setUint16(12, dosDate, true);
    local.setUint32(14, crc, true);
    local.setUint32(18, data.length, true);
    local.setUint32(22, data.length, true);
    local.setUint16(26, name.length, true);
    local.setUint16(28, 0, true);
    body.push(new Uint8Array(local.buffer), name, data);
    const dir = new DataView(new ArrayBuffer(46));
    dir.setUint32(0, 0x02014b50, true);
    dir.setUint16(4, 20, true);        // version made by
    dir.setUint16(6, 20, true);        // version needed
    dir.setUint16(8, flags, true);
    dir.setUint16(10, 0, true);
    dir.setUint16(12, dosTime, true);
    dir.setUint16(14, dosDate, true);
    dir.setUint32(16, crc, true);
    dir.setUint32(20, data.length, true);
    dir.setUint32(24, data.length, true);
    dir.setUint16(28, name.length, true);
    dir.setUint32(42, offset, true);
    central.push(new Uint8Array(dir.buffer), name);
    offset += 30 + name.length + data.length;
  }
  let centralSize = 0;
  for (const chunk of central) centralSize += chunk.length;
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true);
  end.setUint16(8, files.length, true);
  end.setUint16(10, files.length, true);
  end.setUint32(12, centralSize, true);
  end.setUint32(16, offset, true);
  return new Blob([...body, ...central, new Uint8Array(end.buffer)], { type: "application/epub+zip" });
}

/* ---------------- EPUB 素材 ----------------
   图片要作为真正的文件打进 EPUB（不是 data URL），所以这里按字节取。 */
const MAX_EPUB_IMAGE_BYTES = 40 * 1024 * 1024; // 整本书内嵌图片的软上限，超了只留说明
function uuidv4() {
  const bytes = new Uint8Array(16);
  if (window.crypto && crypto.getRandomValues) crypto.getRandomValues(bytes);
  else for (let i = 0; i < 16; i++) bytes[i] = Math.floor(Math.random() * 256);
  bytes[6] = (bytes[6] & 0x0f) | 0x40;
  bytes[8] = (bytes[8] & 0x3f) | 0x80;
  const hex = [...bytes].map((b) => b.toString(16).padStart(2, "0")).join("");
  return hex.slice(0, 8) + "-" + hex.slice(8, 12) + "-" + hex.slice(12, 16) + "-" + hex.slice(16, 20) + "-" + hex.slice(20);
}
/** 属性值转义：esc() 只处理文本节点，属性里的引号得自己来。 */
function xattr(value) { return esc(value).replace(/"/g, "&quot;"); }
function imageKind(bytes) {
  if (bytes.length > 8 && bytes[0] === 0x89 && bytes[1] === 0x50) return { ext: "png", mime: "image/png" };
  if (bytes.length > 3 && bytes[0] === 0xff && bytes[1] === 0xd8) return { ext: "jpg", mime: "image/jpeg" };
  if (bytes.length > 6 && bytes[0] === 0x47 && bytes[1] === 0x49) return { ext: "gif", mime: "image/gif" };
  if (bytes.length > 12 && bytes[8] === 0x57 && bytes[9] === 0x45) return { ext: "webp", mime: "image/webp" };
  return null;
}
async function fetchImageBytes(url) {
  const resp = await fetch(imgProxyUrl(url), { cache: "force-cache" });
  if (!resp.ok) throw new Error("HTTP " + resp.status);
  const type = String(resp.headers.get("content-type") || "").split(";")[0].trim().toLowerCase();
  const bytes = new Uint8Array(await resp.arrayBuffer());
  let kind = imageKind(bytes);
  // 认不出魔数时退回响应头给的类型（有些 CDN 会返回 WebP 但头写 image/jpeg，所以魔数优先）
  if (!kind) {
    if (type === "image/jpeg") kind = { ext: "jpg", mime: "image/jpeg" };
    else if (type === "image/gif") kind = { ext: "gif", mime: "image/gif" };
    else if (type === "image/webp") kind = { ext: "webp", mime: "image/webp" };
    else kind = { ext: "png", mime: "image/png" };
  }
  return { bytes: bytes, ext: kind.ext, mime: kind.mime };
}
function coverUrlOf(item) {
  const urls = (item && item.image_urls) || {};
  return urls.large || urls.original || urls.medium || urls.square || "";
}

/* ---------------- EPUB 打包 ----------------
   一本书 = 一个 .epub：正文、插图、章节目录、书籍信息都在里面，离线可读（分页交给阅读器）。 */
const EPUB_LANG = "ja"; // Pixiv 小说的正文基本是日文，跟着正文走比跟界面语言走更合适
const EPUB_CSS = [
  'body{margin:0 5%;line-height:1.8;word-break:break-word;font-family:"Songti SC","Noto Serif CJK SC",Georgia,serif}',
  'h1,h2{line-height:1.45;margin:1.6em 0 .6em;font-size:1.15em}',
  'p{margin:0 0 1em}',
  'p.sep{text-align:center;color:#aaa;letter-spacing:.4em}',
  'figure.fig{margin:1.4em 0;text-align:center}',
  'figure.fig img{max-width:100%;height:auto}',
  'figure.fig figcaption,.ph{font-size:.85em;color:#888;text-align:center}',
  'ruby rt{font-size:.55em}',
  '.meta{font-size:.9em;color:#666;border-bottom:1px solid #ddd;padding-bottom:.8em;margin-bottom:1.4em}',
  '.meta div{margin:.15em 0}',
  '.src{font-size:.8em;color:#999;margin-top:2em}',
].join("\n");
function xhtmlDoc(title, body) {
  return '<?xml version="1.0" encoding="utf-8"?>\n<!DOCTYPE html>\n' +
    '<html xmlns="http://www.w3.org/1999/xhtml" xmlns:epub="http://www.idpf.org/2007/ops" xml:lang="' + EPUB_LANG + '" lang="' + EPUB_LANG + '">\n' +
    '<head>\n<meta charset="utf-8"/>\n<title>' + esc(title) + '</title>\n' +
    '<link rel="stylesheet" type="text/css" href="../style.css"/>\n</head>\n<body>\n' + body + "\n</body>\n</html>\n";
}
function metaBlock(lines) {
  return '<header class="meta">' + lines.map((line) => "<div>" + esc(line) + "</div>").join("") + "</header>";
}
/** 一段正文 → XHTML 片段；插图取回来存成书里的图片文件，失败/超限只留一句说明。 */
async function xhtmlBody(raw, images, ctx, headings) {
  const parts = [];
  let buffer = "";
  // buffer 里已经是转义过的 XHTML（ruby / 链接要保留标签），换行交给这里补 <br/>
  const flush = () => {
    const content = buffer;
    buffer = "";
    for (const para of content.split(/\n{2,}/)) {
      const text = para.replace(/^\n+|\n+$/g, "");
      if (text.trim()) parts.push("<p>" + text.replace(/\n/g, "<br/>") + "</p>");
    }
  };
  const addImage = async (node) => {
    flush();
    ctx.seq += 1;
    const label = "插图 " + ctx.seq;
    let url = "";
    try {
      if (node.kind === "uploaded") url = pickImageUrl(images && images[node.id]);
      else if (node.kind === "url") url = node.url;
      else url = await resolvePixivImage(node.id, node.page);
    } catch (err) { url = ""; }
    if (!url) { ctx.failed += 1; parts.push('<p class="ph">［' + esc(label) + "：没有取到图片地址］</p>"); return; }
    let entry = ctx.cache.get(url);
    if (!entry) {
      if (ctx.bytes > MAX_EPUB_IMAGE_BYTES) {
        parts.push('<p class="ph">［' + esc(label) + "：文件已很大，未再打包］</p>");
        return;
      }
      try {
        const file = await fetchImageBytes(url);
        entry = { name: "images/img-" + String(ctx.images.length + 1).padStart(4, "0") + "." + file.ext, mime: file.mime, bytes: file.bytes };
        ctx.bytes += file.bytes.length;
        ctx.images.push(entry);
        ctx.cache.set(url, entry);
      } catch (err) {
        ctx.failed += 1;
        parts.push('<p class="ph">［' + esc(label) + "：图片取不到（" + esc((err && err.message) || "未知错误") + "）］</p>");
        return;
      }
    }
    parts.push('<figure class="fig"><img src="../' + entry.name + '" alt="' + xattr(label) + '"/><figcaption>' + esc(label) + "</figcaption></figure>");
  };
  for (const node of parseNovelText(raw)) {
    if (node.t === "text") { buffer += esc(node.v); continue; }
    if (node.t === "chapter") {
      flush();
      const id = "h" + (headings.length + 1);
      headings.push({ id: id, text: node.v });
      parts.push('<h2 id="' + id + '">' + esc(node.v) + "</h2>");
      continue;
    }
    if (node.t === "page") { flush(); parts.push('<p class="sep">· · ·</p>'); continue; }
    if (node.t === "jump") continue; // 翻页标记交给阅读器自己分页，不再插一页说明
    if (node.t === "ruby") { buffer += node.r ? "<ruby>" + esc(node.v) + "<rt>" + esc(node.r) + "</rt></ruby>" : esc(node.v); continue; }
    if (node.t === "link") { buffer += '<a href="' + xattr(node.href) + '">' + esc(node.v) + "</a>"; continue; }
    if (node.t === "img") { await addImage(node); continue; }
  }
  flush();
  return parts.join("\n");
}
/** 一段正文 → HTML 片段；插图取回来内嵌成 data URL，失败/超限就留占位。 */
/** 把一本书（单本小说或整个系列）打成**一个** EPUB 文件。
    book = { title, author, units: [{ title, raw, images }], head: [信息行], notes: [说明行],

  const modified = new Date().toISOString().replace(/\.\d{3}Z$/, "Z");

  docs.forEach((doc) => {
    toc.push({ href: doc.href, title: doc.title });
    doc.headings.forEach((h) => toc.push({ href: doc.href + "#" + h.id, title: h.text }));
  });

  if (cover) {

    manifest.push('<item id="cover" href="cover.xhtml" media-type="application/xhtml+xml"/>');

    '<dc:identifier id="bookid">' + esc(uid) + "</dc:identifier>",

function retryableError(err) {
  const status = err && err.status;
  if (status === 429) return true;                      // 限流
  if (status >= 500 && status <= 599) return true;      // 上游/网关瞬时错误
  // 桥自己换 token 失败的形态：401 + reason=connect_failed（本地链路连不上 Pixiv）
  return !!(err && (err.reason === "connect_failed" || err.reason === "timeout"));
}
async function fetchContentWithRetry(novelId, attempt) {
  const tries = attempt || 0;
  try {
    const data = await callApi("/novel/" + novelId + "/text");
    const result = extractText(data);
    return { text: result.text, images: extractImages(data) };
  } catch (err) {
    if (retryableError(err) && tries < 3) {
      await sleep(2000 * (tries + 1));
      return fetchContentWithRetry(novelId, tries + 1);
    }
    throw err;
  }
}
async function fetchTextWithRetry(novelId, attempt) {
  return (await fetchContentWithRetry(novelId, attempt)).text;
}
// 防连点：正文已在内存时下载是同步完成的，单靠 state.busy 挡不住第二次点击，
// 所以再加一个 1.2 秒的时间窗，避免一次误触导出两份文件。
function downloadBlocked() {
  return state.busy || Date.now() - (state.lastDownload || 0) < 1200;
}
async function downloadCurrent() {
  if (downloadBlocked()) return;
  const cur = state.current;
  if (!cur || !cur.novel) return;
  // 系列里的一章不能单独成书：一本书只能有一个文件，所以直接整本导出
  if (cur.chapters && cur.chapterIndex >= 0) {
    showToast("这本属于系列，按整本导出 EPUB");
    return downloadSeries();
  }
  state.busy = true;
  try {
    const novel = cur.novel;
    await refreshDownloadMarks();
    // 「跳过已下载」：整本下过就不再导出（要重下就去设置里关掉）
    if (skipDownloadedOn() && state.dlMarks[novel.id + "#0"]) {
      showToast("这本已经下载过（在「书架 → 下载记录」里）。想重下可在「Aa → 书架与下载」里关掉「跳过已下载」");
      return;
    }
    let raw = cur.raw;
    let images = cur.images || {};
    if (!raw) {
      showLoading("正在准备 EPUB…");
      const content = await fetchContentWithRetry(novel.id);
      raw = content.text;
      images = content.images;
    }
    showLoading("正在准备 EPUB…");
    const book = {
      title: novel.title,
      author: (novel.user && (novel.user.name || novel.user.account)) || "",
      units: [{ title: novel.title, raw: raw, images: images }],
      head: novelHeaderLines(novel),
      coverUrl: coverUrlOf(novel),
      sourceUrl: "https://www.pixiv.net/novel/show.php?id=" + novel.id,
      description: (novel.caption || "").slice(0, 500),
    };
    const result = await buildBookEpub(book);
    const name = safeFileName(novel.title, "");
    state.lastDownload = Date.now();
    downloadBlob(name, result.blob);
    await recordDownload(downloadRecordOf({
      bookId: novel.id,
      chapterIndex: 0,
      chapterId: novel.id,
      chapterTitle: novel.title,
      title: novel.title,
      user: (novel.user && (novel.user.name || novel.user.account)) || "",
      seriesId: novel.series && novel.series.id,
      seriesTitle: (novel.series && novel.series.title) || "",
      mergeKey: mergeKeyOf(novel),
      file: name,
      bytes: result.blob.size,
      chapters: 1,
    }));
    await refreshDownloadMarks();
    showToast("已导出：" + name);
  } catch (err) {
    showToast("下载失败：" + err.message);
  } finally {
    state.busy = false;
    hideLoading();
  }
}
async function downloadSeries() {
  if (downloadBlocked()) return;
  state.busy = true;
  try {
    let detail = null, chapters = null;
    // 上下文按当前视图取：在系列页时 state.current 可能还留着上一次阅读器的旧章节，
    // 用它会导致在 A 系列页点「下载全系列」却导出 B 系列。
    if (state.view === "series" && state.seriesView && state.seriesView.info) {
      detail = state.seriesView.info.detail; chapters = state.seriesView.info.chapters;
    } else if (state.current && state.current.chapters && state.current.chapters.length) {
      detail = state.current.seriesDetail; chapters = state.current.chapters;
    } else if (state.seriesView && state.seriesView.info) {
      detail = state.seriesView.info.detail; chapters = state.seriesView.info.chapters;
    }
    if (!chapters || !chapters.length) {
      const seriesId = (state.seriesView && state.seriesView.id) ||
        (state.current && state.current.novel && state.current.novel.series && state.current.novel.series.id);
      if (!seriesId) { showToast("这本小说不属于任何系列"); return; }
      const info = await fetchSeries(seriesId);
      detail = info.detail; chapters = info.chapters;
    }
    if (!chapters || !chapters.length) { showToast("系列没有章节"); return; }
    const seriesIdResolved = (detail && detail.id) ||
      (state.seriesView && state.seriesView.id) ||
      (state.current && state.current.seriesDetail && state.current.seriesDetail.id) || null;
    await refreshDownloadMarks(seriesIdResolved);
    if (skipDownloadedOn() && seriesFullyDownloaded(chapters)) {
      showToast("这个系列已经整本下载过（记录在「书架 → 下载记录」里）。想重下可在「Aa → 书架与下载」里关掉「跳过已下载」");
      return;
    }
    const items = [];
    const failed = [];
    for (let i = 0; i < chapters.length; i++) {
      showLoading("下载第 " + (i + 1) + " / " + chapters.length + " 章…");
      try {
        items.push(await fetchContentWithRetry(chapters[i].id));
      } catch (err) {
        // 单章失败不再丢掉整本：留空占位，最后在书末说明缺了哪几章
        items.push({ text: "", images: {} });
        failed.push("第 " + (i + 1) + " 章 " + chapterTitle(chapters[i], i) + "（" + err.message + "）");
      }
      if (i < chapters.length - 1) await sleep(SERIES_FETCH_GAP);
    }
    if (!items.some((item) => item.text)) { showToast("下载失败：所有章节都没取到正文"); return; }
    const notes = [];
    if (failed.length) notes.push("本次未取到正文的章节：" + failed.join("；"));
    const units = chapters.map((chapter, i) => {
      const item = items[i] || {};
      return {
        title: "第 " + (i + 1) + " 章　" + chapterTitle(chapter, i),
        raw: item.text || "",
        images: item.images || {},
        html: item.text ? "" : '<p class="ph">（本章未取到正文）</p>',
      };
    });
    const title = (detail && detail.title) || "系列";
    const user = (detail && detail.user) || {};
    const head = ["《" + title + "》"];
    head.push("作者：" + (user.name || "未知") + (user.account ? "（" + user.account + "）" : ""));
    if (detail && detail.id) head.push("系列页：https://www.pixiv.net/novel/series/" + detail.id);
    head.push("共 " + chapters.length + " 章");
    showLoading("正在准备 EPUB…");
    const result = await buildBookEpub({
      title: title,
      author: user.name || user.account || "",
      units: units,
      head: head,
      notes: notes,
      coverUrl: coverUrlOf(detail || {}),
      sourceUrl: detail && detail.id ? ("https://www.pixiv.net/novel/series/" + detail.id) : "",
    });
    // 缺章只写进书里和提示里，不写进文件名 —— 同一本书重复下载始终是同一个文件
    const name = safeFileName(title, "（全" + chapters.length + "章）");
    state.lastDownload = Date.now();
    downloadBlob(name, result.blob);
    // 下载记录按章节逐条记：bookId#chapterIndex 是主键，同系列名下两个不同的
    // 「第一章」（两个不同 book_id）会各留一条，合并导出时都能看见
    for (let i = 0; i < chapters.length; i++) {
      if (!items[i] || !items[i].text) continue;   // 没取到正文的章节不记，免得假装下过
      await recordDownload(downloadRecordOf({
        bookId: chapters[i].id,
        chapterIndex: i,
        chapterId: chapters[i].id,
        chapterTitle: chapterTitle(chapters[i], i),
        title: title,
        user: user.name || user.account || "",
        seriesId: (detail && detail.id) || null,
        seriesTitle: title,
        mergeKey: mergeKeyOf({ series: { title: title } }),
        file: name,
        bytes: result.blob.size,
        chapters: chapters.length,
      }));
    }
    await refreshDownloadMarks(seriesIdResolved);
    renderSeriesDlState();
    showToast("已导出：" + name + (failed.length ? ("（缺 " + failed.length + " 章，书末有说明）") : ""));
  } catch (err) {
    showToast("下载失败：" + err.message);
  } finally {
    state.busy = false;
    hideLoading();
  }
}

async function loadAuthBadge() {
  const badge = $("auth-badge");
  try {
    const status = await callApi("/auth/status");
    // 状态随时可能变（refresh token 失效 / 接口 502），绿底必须跟着变
    badge.classList.toggle("ok", !!status.authenticated);
    if (status.authenticated) {
      const name = (status.user && status.user.name) || "";
      badge.textContent = "已登录" + (name ? "：" + name : "");
    } else if (status.refresh_token_set) {
      badge.textContent = "已配置 refresh token（等待首次请求换取 access token）";
    } else {
      badge.textContent = "未登录（需配置 refresh token）";
    }
  } catch (err) {
    badge.classList.remove("ok");
    badge.textContent = "接口不可用";
  }
}

/* ---------------- 路由 ---------------- */
function route() {
  // 畸形 hash（例如手改出来的 #/read/%）不能让 decodeURIComponent 抛错把路由打死
  let raw = "";
  try { raw = decodeURIComponent(location.hash.replace(/^#\/?/, "")).trim(); }
  catch (e) { raw = ""; }
  const parts = raw.split("/").filter(Boolean);
  const kind = parts[0] || "";
  const id = parts[1] || "";
  closeDrawers();
  if (kind === "read" && id) return openReader(id);
  if (kind === "series" && id) return openSeries(id, "");
  if (kind === "user" && id) return openUser(id, "");
  if (kind === "shelf") { state.source = "shelf"; setFilters(); setNavActive(); renderShelf(); return; }
  if (kind === "bookmarks") { state.source = "bookmarks"; setFilters(); setNavActive(); renderFavs(); return; }
  showView("list");
  // 深链直接进详情页（例如书签 #/read/123）后再返回列表时，列表可能一次都没加载过：
  // 这里补一次默认来源，否则用户看到的是一张空白页。
  if (!state.loaded) { setNavSource(state.source); return; }
  // 回来时恢复离开列表前的滚动位置（同样不依赖 rAF：无头/后台环境里 rAF 可能永不触发）
  const back = state.listScroll || 0;
  window.scrollTo(0, back);
  requestAnimationFrame(() => window.scrollTo(0, back));
}
function goList() {
  // 离开阅读页前立刻落盘进度：滚动事件的保存有 500ms 防抖，马上点返回会丢掉最后一次
  clearTimeout(saveTimer);
  saveProgress();
  if (location.hash === "" || location.hash === "#/" || location.hash === "#/shelf") route();
  else location.hash = "#/";
}
